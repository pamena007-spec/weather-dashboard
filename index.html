<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Weather Dashboard - search any city and see its current weather." />
  <title>Weather Dashboard</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>Weather Dashboard</h1>
      <p>Search for a city to see its current weather.</p>
    </header>

    <!-- Search section -->
    <section class="search-section" aria-label="City search">
      <form id="search-form" class="search-form" novalidate>
        <label for="city-input" class="visually-hidden">City name</label>
        <input
          type="text"
          id="city-input"
          name="city"
          placeholder="Enter a city, e.g. London"
          autocomplete="off"
        />
        <button type="submit" id="search-btn">Search</button>
      </form>

      <!-- Loading and error messages -->
      <p id="loading" class="status loading hidden" role="status">Loading weather data...</p>
      <p id="error" class="status error hidden" role="alert"></p>
    </section>

    <!-- Weather card -->
    <section id="weather-card" class="weather-card hidden" aria-live="polite">
      <div class="weather-main">
        <div id="weather-icon" class="weather-icon" aria-hidden="true">☀️</div>
        <div class="weather-summary">
          <h2 id="city-name">City</h2>
          <p id="country" class="country">Country</p>
          <p id="date-time" class="date-time">--</p>
        </div>
      </div>

      <div class="temperature-block">
        <p id="temperature" class="temperature">--°C</p>
        <p id="condition" class="condition">--</p>
      </div>

      <div class="details-grid">
        <article class="detail">
          <span class="detail-label">Feels like</span>
          <span id="feels-like" class="detail-value">--</span>
        </article>
        <article class="detail">
          <span class="detail-label">Humidity</span>
          <span id="humidity" class="detail-value">--</span>
        </article>
        <article class="detail">
          <span class="detail-label">Wind speed</span>
          <span id="wind" class="detail-value">--</span>
        </article>
        <article class="detail">
          <span class="detail-label">Sunrise</span>
          <span id="sunrise" class="detail-value">--</span>
        </article>
        <article class="detail">
          <span class="detail-label">Sunset</span>
          <span id="sunset" class="detail-value">--</span>
        </article>
      </div>
    </section>

    <footer class="app-footer">
      <p>Weather data by <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a>. Built with HTML, CSS and JavaScript.</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
